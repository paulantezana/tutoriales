# Compila la app YARBYS (jarvis-movil/yarbys) y deja el APK listo para descargar.
# - En cada push que cambie la app: el APK queda en la pestaña Actions (artefacto "yarbys-apk").
# - Si publicas un Release en GitHub: el APK se adjunta a ese Release.
name: YARBYS APK

on:
  push:
    branches: ["**"]
    paths:
      - "jarvis-movil/yarbys/**"
      - ".github/workflows/yarbys-apk.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-movil/yarbys
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar APK (solo arm64, el que usan los celulares modernos)
        run: flutter build apk --release --target-platform android-arm64

      - name: Renombrar
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/yarbys.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yarbys-apk
          path: jarvis-movil/yarbys/build/app/outputs/flutter-apk/yarbys.apk

      - name: Adjuntar al Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: jarvis-movil/yarbys/build/app/outputs/flutter-apk/yarbys.apk

      # Descarga directa desde el celular, sin iniciar sesión ni descomprimir:
      # https://github.com/<usuario>/<repo>/releases/download/yarbys-latest/yarbys.apk
      - name: Publicar la última versión
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yarbys-latest
          target_commitish: ${{ github.sha }}
          name: YARBYS (última versión)
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            APK de YARBYS compilado automáticamente (rama ${{ github.ref_name }}, commit ${{ github.sha }}).

            1. Descarga **yarbys.apk** desde tu celular Android 11 o superior.
            2. Ábrelo y permite "instalar apps desconocidas".
            3. Abre YARBYS y toca **Descargar modelos** (usa Wi-Fi: unos 2.8 GB).
          files: jarvis-movil/yarbys/build/app/outputs/flutter-apk/yarbys.apk
